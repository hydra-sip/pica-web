# Lint, tests y build en cada PR y en cada push a dev/main, y en paralelo los E2E de Playwright contra el back de dev.
# Al mergear a dev, además publica la imagen en GHCR y actualiza la web de staging
# (los pasos de la instancia están en pica-back/infra/README.md).
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

env:
  IMAGEN: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vitest pide Node ^22.12 o ^24; el Dockerfile sigue en 20 porque solo hace el build
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # E2E de Playwright (PICA-439): el front sin mocks contra la imagen del back de dev con el seed (e2e/docker-compose.yml).
  # Corre en paralelo con verify, así que no alarga el CI; el reporte y las trazas suben solo si falla.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Arranca primero: mientras baja la imagen y migra la base, se instala el resto
      - name: Levantar el back
        run: docker compose -f e2e/docker-compose.yml up -d

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Caché de los navegadores
        id: navegadores
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Instalar Chromium
        if: steps.navegadores.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Dependencias de Chromium
        if: steps.navegadores.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Esperar al back
        run: docker compose -f e2e/docker-compose.yml up -d --wait

      - name: Correr los E2E
        run: npm run e2e

      - name: Log del back
        if: failure()
        run: mkdir -p test-results && docker compose -f e2e/docker-compose.yml logs api > test-results/api.log 2>&1

      - name: Guardar el reporte
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # En los PR solo comprueba que el Dockerfile construye; en dev la publica
  imagen:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t "$IMAGEN:dev" -t "$IMAGEN:${{ github.sha }}" .

      - name: Publicar en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push --all-tags "$IMAGEN"

  # Se saltea hasta que exista la variable STAGING_HOST
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.STAGING_HOST != ''
    needs: imagen
    runs-on: ubuntu-latest
    concurrency: staging
    environment:
      name: staging
      url: https://${{ vars.STAGING_HOST }}
    env:
      DESTINO: ${{ vars.STAGING_SSH_USER }}@${{ vars.STAGING_HOST }}
    steps:
      - name: Clave SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Actualizar staging
        run: ssh "$DESTINO" 'cd /opt/pica && docker compose pull web && docker compose up -d web && docker image prune -f'

      - name: Prueba de humo
        run: curl -fsS -o /dev/null --retry 10 --retry-delay 3 --retry-all-errors "https://${{ vars.STAGING_HOST }}/"
