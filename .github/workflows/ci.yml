# Lint y build en cada PR y en cada push a dev/main.
# Al mergear a dev, además publica la imagen en GHCR y actualiza la web de staging
# (los pasos de la instancia están en pica-back/infra/README.md).
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

env:
  IMAGEN: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # En los PR solo comprueba que el Dockerfile construye; en dev la publica
  imagen:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t "$IMAGEN:dev" -t "$IMAGEN:${{ github.sha }}" .

      - name: Publicar en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push --all-tags "$IMAGEN"

  # Se saltea hasta que exista la variable STAGING_HOST
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.STAGING_HOST != ''
    needs: imagen
    runs-on: ubuntu-latest
    concurrency: staging
    environment:
      name: staging
      url: https://${{ vars.STAGING_HOST }}
    env:
      DESTINO: ${{ vars.STAGING_SSH_USER }}@${{ vars.STAGING_HOST }}
    steps:
      - name: Clave SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Actualizar staging
        run: ssh "$DESTINO" 'cd /opt/pica && docker compose pull web && docker compose up -d web && docker image prune -f'

      - name: Prueba de humo
        run: curl -fsS -o /dev/null --retry 10 --retry-delay 3 --retry-all-errors "https://${{ vars.STAGING_HOST }}/"
